<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dashboard viewport</title></head>
<body style="margin:0;overflow:hidden"><script>
const send = (type, payload = {}) => window.parent.postMessage({isStreamlitMessage:true, type, ...payload}, '*');
let lastSize = '', resizeTimer;
function reportSize() {
  const size = {height: window.parent.innerHeight, width: window.parent.innerWidth};
  const signature = JSON.stringify(size);
  if (signature !== lastSize) {
    lastSize = signature;
    send('streamlit:setComponentValue', {dataType:'json', value:size});
  }
  send('streamlit:setFrameHeight', {height:0});
}
window.addEventListener('message', event => {
  if (event.source === window.parent && event.data?.type === 'streamlit:render') reportSize();
});
window.parent.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(reportSize, 150);
});
send('streamlit:componentReady', {apiVersion:1});
</script></body></html>
