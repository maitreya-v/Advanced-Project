<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horizontal story chain</title>
<style>
:root { color-scheme:light; font-family:system-ui,-apple-system,sans-serif; color:#173248; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; }
.shell { border:1px solid #dce6eb; border-radius:12px; overflow:hidden; }
.heading { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:8px; padding:12px 15px; border-bottom:1px solid #e5edf1; }
.heading strong { font-size:14px; } .context { font-size:12px; color:#637b8c; }
.scroller { overflow-x:auto; overscroll-behavior-x:contain; scrollbar-color:#a8bdc8 #f1f6f8; scrollbar-width:thin; }
.track { display:flex; flex-wrap:nowrap; align-items:center; width:max-content; min-width:100%; padding:20px 16px 14px; }
.node { flex:0 0 148px; width:148px; min-height:112px; border:1px solid #d9e4e9; border-top:3px solid #8295a3; border-radius:10px; padding:10px 12px; background:#f8fbfc; }
.node.current { background:#edf8f5; border-color:#42977e; box-shadow:0 0 0 2px #42977e15; }
.role { color:#708596; text-transform:uppercase; font-size:9px; letter-spacing:1.2px; }
.node-name { margin:7px 0; font-weight:650; font-size:13px; line-height:1.35; overflow-wrap:anywhere; }
.domain { font-size:10px; line-height:1.3; color:#698092; text-transform:capitalize; }
button { font:inherit; cursor:pointer; }
button:focus-visible, .scroller:focus-visible { outline:3px solid #258fbe; outline-offset:-3px; }
.edge { flex:0 0 78px; width:78px; align-self:stretch; border:0; border-radius:8px; padding:10px 5px; background:transparent; color:#567181; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:8px; }
.edge:hover { background:#f0f6f8; } .edge[aria-pressed="true"] { background:#eaf6f1; color:#226b56; }
.edge-label { font-size:9px; font-weight:650; white-space:nowrap; }
.arrow { height:2px; width:54px; background:currentColor; position:relative; }
.arrow::after { content:""; position:absolute; right:-1px; top:-4px; border-top:5px solid transparent; border-bottom:5px solid transparent; border-left:7px solid currentColor; }
.strength { font-size:10px; font-variant-numeric:tabular-nums; }
.footer { padding:10px 14px; border-top:1px solid #e5edf1; display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:9px; }
.progress { font-size:12px; font-weight:600; } .hint { margin-top:3px; font-size:10px; color:#708596; }
.navigation { display:flex; gap:6px; }
.navigation button { background:#f6fafb; color:#355c70; border:1px solid #d9e4e9; border-radius:7px; padding:6px 10px; font-size:11px; }
.navigation button:disabled { opacity:.4; cursor:default; }
.reading { margin-top:14px; padding:18px; border:1px solid #dce6eb; border-radius:12px; }
.reading h2 { font-size:17px; margin:0 0 12px; }
.reading p { font-size:14px; line-height:1.65; }
.examples { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
.examples strong, .reading summary { font-size:12px; color:#637b8c; }
.reading .note { font-size:11px; color:#637b8c; }
.standalone #chain-document { padding:16px; }
.compact .heading { padding:8px 12px; }
.compact .track { padding:10px 12px; }
.compact .node { min-height:84px; padding:7px 10px; }
.compact .node-name { font-size:12px; margin:5px 0; }
.compact .footer { padding:7px 12px; }
.comparison .heading { padding:5px 10px; }
.comparison .track { padding:6px 10px; }
.comparison .node { flex-basis:132px; width:132px; min-height:58px; padding:6px 8px; }
.comparison .role, .comparison .domain, .comparison .hint { display:none; }
.comparison .footer { padding:5px 10px; }
.active-chain .shell { border-color:#28717b; box-shadow:inset 0 0 0 1px #28717b; }
@media (max-width:600px) { .examples { grid-template-columns:1fr; gap:4px; } }
@media (prefers-reduced-motion:reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<main id="chain-document">
<section class="shell" aria-label="Selected directed chain">
  <div class="heading"><strong>Story chain</strong><span class="context" id="context"></span></div>
  <div class="scroller" id="scroller" tabindex="0" aria-label="Horizontal chain; scroll to see every step">
    <div class="track" id="track"></div>
  </div>
  <div class="footer">
    <div><div class="progress" id="progress" aria-live="polite"></div><div class="hint">Select an arrow to read its story. Strengths are authored model values.</div></div>
    <div class="navigation"><button id="previous" aria-label="Previous chain step">← Previous</button><button id="next" aria-label="Next chain step">Next →</button></div>
  </div>
</section>
<section class="reading" id="reading" hidden aria-label="Selected step story"></section>
</main>
<script>
const INITIAL_CHAIN = /* INITIAL_CHAIN */null;
const byId = id => document.getElementById(id);
let chain = null, selected = 0, context = '', lastHeight = 0;
let edgeButtons = [], nodeCards = [];
function send(type, payload = {}) {
  if (window.parent !== window) window.parent.postMessage({isStreamlitMessage:true, type, ...payload}, '*');
}
function sizeFrame() {
  const height = Math.ceil(byId('chain-document').getBoundingClientRect().height) + 2;
  if (height !== lastHeight) { lastHeight = height; send('streamlit:setFrameHeight', {height}); }
}
function text(parent, tag, value, className) {
  const element = document.createElement(tag);
  element.textContent = value;
  if (className) element.className = className;
  parent.appendChild(element);
  return element;
}
function selectStep(index, emit = false, focus = false, reveal = false) {
  if (!chain || !Number.isInteger(index) || index < 0 || index >= chain.steps.length) return;
  selected = index;
  edgeButtons.forEach((button, i) => button.setAttribute('aria-pressed', String(i === selected)));
  nodeCards.forEach((card, i) => card.classList.toggle('current', i === selected || i === selected + 1));
  byId('progress').textContent = `Step ${selected + 1} of ${chain.steps.length}`;
  byId('previous').disabled = selected === 0;
  byId('next').disabled = selected === chain.steps.length - 1;
  document.body.dataset.selectedStep = String(selected);
  if (INITIAL_CHAIN) {
    const step = chain.steps[selected], reading = byId('reading');
    reading.hidden = false;
    reading.replaceChildren();
    text(reading, 'h2', `Step ${selected + 1} · ${step.source} → ${step.target}`);
    text(reading, 'p', step.reason);
    const examples = text(reading, 'div', '', 'examples');
    step.examples.forEach((example, i) => {
      const column = text(examples, 'div', '');
      text(column, 'strong', `Example ${i + 1}`);
      text(column, 'p', example);
    });
    const details = text(reading, 'details', '');
    text(details, 'summary', 'Original graph explanation and review');
    text(details, 'p', step.explanation);
    if (step.snapshot_review) text(details, 'p', `${step.snapshot_review.status.replaceAll('_', ' ')} · ${step.snapshot_review.observation}`);
    text(reading, 'p', chain.fiction_note, 'note');
  }
  if (reveal) edgeButtons[selected].scrollIntoView({block:'nearest', inline:'center', behavior:'auto'});
  if (focus) edgeButtons[selected].focus({preventScroll:true});
  if (emit) {
    const value = {version:chain.version, scenario:chain.scenario, query_id:chain.query_id,
      chain_id:chain.chain_id, step_index:selected, edge_id:chain.steps[selected].edge_id,
      event_id:crypto.randomUUID()};
    send('streamlit:setComponentValue', {dataType:'json', value});
  }
}
function render(incoming, selectedStep = 0) {
  const nextContext = `${incoming.query_id}/${incoming.chain_id}`;
  chain = incoming;
  if (context !== nextContext) {
    context = nextContext;
    byId('track').replaceChildren();
    edgeButtons = []; nodeCards = [];
    byId('context').textContent = `${chain.scenario.year} · Age ${chain.scenario.age} · ${chain.steps.length} directed steps`;
    chain.nodes.forEach((node, index) => {
      const card = text(byId('track'), 'div', '', 'node');
      if (typeof node.color === 'string' && CSS.supports('color', node.color)) card.style.borderTopColor = node.color;
      text(card, 'div', index === 0 ? 'Start' : index === chain.nodes.length - 1 ? 'End' : `Concept ${index + 1}`, 'role');
      text(card, 'div', node.label, 'node-name');
      text(card, 'div', node.domain.replaceAll('_', ' '), 'domain');
      nodeCards.push(card);
      if (index >= chain.steps.length) return;
      const step = chain.steps[index];
      const button = text(byId('track'), 'button', '', 'edge');
      button.type = 'button'; button.dataset.step = String(index);
      button.setAttribute('aria-label', `Step ${index + 1}: ${step.source} to ${step.target}, ${step.sign === '+' ? 'positive' : 'negative'}, authored strength ${step.strength.toFixed(2)}`);
      text(button, 'span', step.sign === '+' ? '+ Positive' : '− Negative', 'edge-label');
      text(button, 'span', '', 'arrow');
      text(button, 'span', step.strength.toFixed(2), 'strength');
      button.onclick = () => selectStep(index, true, false, true);
      button.onkeydown = event => {
        const destination = {ArrowLeft:index - 1, ArrowRight:index + 1, Home:0, End:chain.steps.length - 1}[event.key];
        if (destination !== undefined) { event.preventDefault(); selectStep(destination, true, true, true); }
      };
      edgeButtons.push(button);
    });
    byId('scroller').scrollLeft = 0;
  }
  selectStep(selectedStep);
  sizeFrame();
}
byId('previous').onclick = () => selectStep(selected - 1, true, true, true);
byId('next').onclick = () => selectStep(selected + 1, true, true, true);
window.addEventListener('message', event => {
  if (event.source !== window.parent || event.data?.type !== 'streamlit:render') return;
  const args = event.data.args;
  if (args?.chain?.version === 'horizontal-chain-v1') {
    document.body.classList.toggle('compact', args.compact === true);
    document.body.classList.toggle('comparison', args.comparison === true);
    document.body.classList.toggle('active-chain', args.active === true);
    document.querySelector('.heading strong').textContent = args.label || 'Story chain';
    render(args.chain, args.selected_step ?? 0);
  }
});
new ResizeObserver(sizeFrame).observe(byId('chain-document'));
send('streamlit:componentReady', {apiVersion:1});
if (INITIAL_CHAIN) { document.body.classList.add('standalone'); render(INITIAL_CHAIN); }
</script>
</body>
</html>
